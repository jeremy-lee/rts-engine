name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Run tests
        run: .\build\Release\rts_tests.exe

      - name: Lint rules
        run: .\build\Release\rts_lint.exe data\rules.yaml

      - name: AutoTest (AI vs AI)
        run: .\build\Release\rts_autotest.exe --runs 2

      - name: AutoTest (symmetric seeds)
        run: .\build\Release\rts_autotest.exe --symmetric --runs 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ./build/rts_tests

      - name: Lint rules
        run: ./build/rts_lint data/rules.yaml

      - name: AutoTest (AI vs AI)
        run: ./build/rts_autotest --runs 2

      - name: AutoTest (symmetric seeds)
        run: ./build/rts_autotest --symmetric --runs 1
